<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0b1120; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
  <defs>
    <filter id="glowAlert" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title &amp; Metadata Header -->
  <rect x="20" y="16" width="760" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="36" y="44" fill="#38bdf8" font-size="16" font-weight="bold">SYSTEM SCHEMATIC: CONVEYOR VFD &amp; MOTOR OVERLOAD DRIVE</text>
  <text x="580" y="44" fill="#94a3b8" font-size="12">DOC ID: DIA-CB4400-E101 | REV 2.1</text>

  <!-- AC Mains Supply -->
  <rect x="50" y="200" width="100" height="120" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="65" y="235" fill="#f8fafc" font-size="12" font-weight="bold">3-PHASE</text>
  <text x="65" y="255" fill="#f8fafc" font-size="12" font-weight="bold">400V AC</text>
  <text x="65" y="290" fill="#94a3b8" font-size="10">50/60 Hz</text>

  <!-- Main Contactor -->
  <rect x="200" y="210" width="80" height="100" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="245" fill="#cbd5e1" font-size="11" font-weight="bold">CONTACTOR</text>
  <text x="218" y="270" fill="#94a3b8" font-size="11">KM-01</text>

  <!-- Lines from Mains to Contactor -->
  <line x1="150" y1="230" x2="200" y2="230" stroke="#f59e0b" stroke-width="3"/>
  <line x1="150" y1="260" x2="200" y2="260" stroke="#ef4444" stroke-width="3"/>
  <line x1="150" y1="290" x2="200" y2="290" stroke="#3b82f6" stroke-width="3"/>

  <!-- VFD Inverter Drive (E101 Monitoring Core) -->
  <g filter="url(#glowAlert)">
    <rect x="330" y="160" width="160" height="180" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  </g>
  <rect x="345" y="180" width="130" height="40" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="355" y="205" fill="#ef4444" font-size="12" font-weight="bold">ERR: E101 FLA &gt;125%</text>
  <text x="350" y="245" fill="#f8fafc" font-size="12" font-weight="bold">VFD INVERTER VFD-01</text>
  <text x="350" y="270" fill="#94a3b8" font-size="10">IGBT Inverter Module</text>
  <text x="350" y="295" fill="#f87171" font-size="10" font-weight="bold">Thermal Overcurrent Trip</text>
  <text x="350" y="315" fill="#94a3b8" font-size="10">Trip Time: &gt; 3.5 sec</text>

  <!-- Lines from Contactor to VFD -->
  <line x1="280" y1="240" x2="330" y2="240" stroke="#f59e0b" stroke-width="3"/>
  <line x1="280" y1="260" x2="330" y2="260" stroke="#ef4444" stroke-width="3"/>
  <line x1="280" y1="280" x2="330" y2="280" stroke="#3b82f6" stroke-width="3"/>

  <!-- Drive Motor M-01 -->
  <circle cx="580" cy="250" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="580" cy="250" r="38" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="555" y="245" fill="#f8fafc" font-size="13" font-weight="bold">MOTOR</text>
  <text x="562" y="265" fill="#38bdf8" font-size="11">M-01</text>
  <text x="548" y="325" fill="#94a3b8" font-size="11">4.0 kW Induction</text>

  <!-- Lines VFD to Motor -->
  <line x1="490" y1="230" x2="528" y2="230" stroke="#38bdf8" stroke-width="3"/>
  <line x1="490" y1="250" x2="525" y2="250" stroke="#38bdf8" stroke-width="3"/>
  <line x1="490" y1="270" x2="528" y2="270" stroke="#38bdf8" stroke-width="3"/>

  <!-- Mechanical Belt &amp; Head Pulley -->
  <rect x="690" y="200" width="30" height="100" rx="15" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="635" y1="250" x2="690" y2="250" stroke="#cbd5e1" stroke-width="6"/>
  <text x="660" y="325" fill="#94a3b8" font-size="11">Gearbox &amp; Pulley</text>

  <!-- Belt Representation -->
  <path d="M 705 200 L 760 180 L 760 320 L 705 300" fill="none" stroke="#64748b" stroke-width="5"/>

  <!-- Diagnostic Note Box -->
  <rect x="300" y="80" width="350" height="55" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="312" y="102" fill="#fef2f2" font-size="11" font-weight="bold">CONVEYOR E101 CORRECTIVE CHECK:</text>
  <text x="312" y="120" fill="#fecaca" font-size="10">Inspect for jammed conveyor skirtboard &amp; measure motor FLA</text>
  <line x1="410" y1="135" x2="410" y2="160" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
</svg>