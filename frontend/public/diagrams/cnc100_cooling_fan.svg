<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0b1120; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
  <defs>
    <filter id="fanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="heatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Title & Metadata Header -->
  <rect x="20" y="16" width="760" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="36" y="44" fill="#38bdf8" font-size="16" font-weight="bold">SYSTEM SCHEMATIC: CNC-100 SPINDLE COOLING FAN &amp; THERMAL DUCT</text>
  <text x="575" y="44" fill="#94a3b8" font-size="12">DOC ID: DIA-CNC100-E101 | REV 2.0</text>

  <!-- Machine Model Subtitle Banner -->
  <rect x="20" y="74" width="760" height="28" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="93" fill="#64748b" font-size="11" font-weight="bold">UNIT: CNC-100 (MODEL X200 MACHINING CENTER) | SUBSYSTEM: MOTOR THERMAL MANAGEMENT</text>

  <!-- Air Intake Grille & Filter -->
  <rect x="50" y="180" width="80" height="180" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="55" y1="205" x2="125" y2="205" stroke="#64748b" stroke-width="2"/>
  <line x1="55" y1="230" x2="125" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="55" y1="255" x2="125" y2="255" stroke="#64748b" stroke-width="2"/>
  <line x1="55" y1="280" x2="125" y2="280" stroke="#64748b" stroke-width="2"/>
  <line x1="55" y1="305" x2="125" y2="305" stroke="#64748b" stroke-width="2"/>
  <line x1="55" y1="330" x2="125" y2="330" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="165" fill="#94a3b8" font-size="11" font-weight="bold">INTAKE GRILLE</text>
  <text x="60" y="380" fill="#64748b" font-size="10">Dust Mesh Filter</text>

  <!-- Cooling Fan Housing (Primary E101 Failure Location) -->
  <g filter="url(#fanGlow)">
    <rect x="170" y="160" width="130" height="220" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  </g>
  <circle cx="235" cy="270" r="55" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <!-- Fan Blades -->
  <path d="M 235 270 L 235 220 A 15 15 0 0 1 255 230 Z" fill="#ef4444"/>
  <path d="M 235 270 L 285 270 A 15 15 0 0 1 275 290 Z" fill="#ef4444"/>
  <path d="M 235 270 L 235 320 A 15 15 0 0 1 215 310 Z" fill="#ef4444"/>
  <path d="M 235 270 L 185 270 A 15 15 0 0 1 195 250 Z" fill="#ef4444"/>
  <circle cx="235" cy="270" r="16" fill="#f87171"/>
  <text x="180" y="145" fill="#fca5a5" font-size="11" font-weight="bold">REAR COOLING FAN</text>
  <text x="185" y="400" fill="#ef4444" font-size="10" font-weight="bold">E101: FAN STALL / JAM</text>
  <text x="185" y="416" fill="#94a3b8" font-size="9">Check for chip debris</text>

  <!-- Airflow Duct Arrows -->
  <path d="M 130 270 L 165 270" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 300 240 L 370 240" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 300 300 L 370 300" stroke="#38bdf8" stroke-width="4"/>
  <text x="310" y="230" fill="#38bdf8" font-size="10">AIRFLOW</text>

  <!-- Spindle Motor Housing & Thermal Fins -->
  <rect x="370" y="140" width="280" height="260" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="390" y="160" width="240" height="220" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="185" fill="#f8fafc" font-size="13" font-weight="bold">SPINDLE MOTOR (X200)</text>

  <!-- Cooling Fins Representation -->
  <rect x="400" y="200" width="220" height="15" rx="2" fill="#334155"/>
  <rect x="400" y="225" width="220" height="15" rx="2" fill="#334155"/>
  <rect x="400" y="250" width="220" height="15" rx="2" fill="#334155"/>
  <rect x="400" y="275" width="220" height="15" rx="2" fill="#334155"/>
  <rect x="400" y="300" width="220" height="15" rx="2" fill="#334155"/>
  <rect x="400" y="325" width="220" height="15" rx="2" fill="#334155"/>
  <rect x="400" y="350" width="220" height="15" rx="2" fill="#334155"/>

  <!-- Temperature Sensor RTD Callout -->
  <circle cx="510" cy="275" r="14" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="502" y="280" fill="#0f172a" font-size="11" font-weight="bold">RTD</text>
  <text x="445" y="425" fill="#fbbf24" font-size="10" font-weight="bold">THERMAL SENSOR &gt; 90&#176;C</text>

  <!-- Exhaust Ventilation Louvers -->
  <rect x="680" y="180" width="70" height="180" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="685" y1="210" x2="745" y2="210" stroke="#f59e0b" stroke-width="2"/>
  <line x1="685" y1="240" x2="745" y2="240" stroke="#f59e0b" stroke-width="2"/>
  <line x1="685" y1="270" x2="745" y2="270" stroke="#ef4444" stroke-width="2"/>
  <line x1="685" y1="300" x2="745" y2="300" stroke="#ef4444" stroke-width="2"/>
  <line x1="685" y1="330" x2="745" y2="330" stroke="#ef4444" stroke-width="2"/>
  <text x="685" y="165" fill="#94a3b8" font-size="10" font-weight="bold">EXHAUST VENTS</text>
  <text x="685" y="380" fill="#64748b" font-size="9">Clean ducts</text>

  <!-- Corrective Action Instruction Box -->
  <rect x="360" y="106" width="300" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="370" y="124" fill="#fee2e2" font-size="10" font-weight="bold">E101 ACTION: Clean rear fan &amp; cool down 20 min</text>
</svg>
