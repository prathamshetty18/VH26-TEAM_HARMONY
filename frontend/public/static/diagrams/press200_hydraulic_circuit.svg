<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0b1120; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
  <defs>
    <filter id="pressGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Metadata Header -->
  <rect x="20" y="16" width="760" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="36" y="44" fill="#38bdf8" font-size="16" font-weight="bold">HYDRAULIC SCHEMATIC: PRESS-200 MAIN PRESSURE LOOP &amp; SAFETY VALVES</text>
  <text x="580" y="44" fill="#94a3b8" font-size="12">DOC ID: DIA-P400-E101 | REV 2.0</text>

  <!-- Machine Model Subtitle Banner -->
  <rect x="20" y="74" width="760" height="28" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="93" fill="#64748b" font-size="11" font-weight="bold">UNIT: PRESS-200 (MODEL P400 HYDRAULIC PRESS) | SUBSYSTEM: HYDRAULIC POWER UNIT</text>

  <!-- Hydraulic Fluid Reservoir -->
  <rect x="40" y="280" width="170" height="150" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
  <rect x="45" y="320" width="160" height="105" rx="4" fill="#d97706" fill-opacity="0.25"/>
  <text x="65" y="308" fill="#e2e8f0" font-size="12" font-weight="bold">MAIN OIL TANK</text>
  <text x="65" y="345" fill="#fcd34d" font-size="11">ISO VG 46 Oil</text>
  <text x="65" y="365" fill="#94a3b8" font-size="10">Capacity: 250 L</text>
  <!-- Sight Level Gauge -->
  <rect x="180" y="320" width="15" height="90" rx="2" fill="#1e293b" stroke="#fcd34d" stroke-width="1.5"/>
  <line x1="180" y1="365" x2="195" y2="365" stroke="#ef4444" stroke-width="2"/>
  <text x="135" y="420" fill="#f87171" font-size="9">MIN Level Mark</text>

  <!-- Main Hydraulic Pump P-200 -->
  <circle cx="280" cy="230" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="265,215 305,230 265,245" fill="#38bdf8"/>
  <text x="240" y="170" fill="#f8fafc" font-size="12" font-weight="bold">PUMP P-400</text>
  <text x="245" y="295" fill="#94a3b8" font-size="11">180 Bar Rating</text>

  <!-- Suction Line -->
  <path d="M 120 280 L 120 230 L 235 230" fill="none" stroke="#d97706" stroke-width="4"/>
  <text x="135" y="220" fill="#d97706" font-size="10">Suction Line</text>

  <!-- Pressure Line & Relief Valve (E101 Low Pressure Point) -->
  <path d="M 325 230 L 400 230" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <g filter="url(#pressGlow)">
    <rect x="400" y="190" width="110" height="80" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  </g>
  <text x="412" y="215" fill="#fca5a5" font-size="11" font-weight="bold">RELIEF VALVE</text>
  <text x="412" y="235" fill="#fee2e2" font-size="10">Model RV-02</text>
  <text x="412" y="255" fill="#ef4444" font-size="10" font-weight="bold">E101: SEAL LEAK</text>
  <text x="405" y="285" fill="#f87171" font-size="9">Inspect main hose seal</text>

  <!-- E-Stop Master Dump Valve (E202 Point) -->
  <rect x="400" y="320" width="110" height="70" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="345" fill="#fef3c7" font-size="11" font-weight="bold">E-STOP DUMP</text>
  <text x="410" y="365" fill="#fde68a" font-size="10">Solenoid SV-01</text>
  <text x="410" y="380" fill="#f59e0b" font-size="9" font-weight="bold">E202 Interlock</text>
  <path d="M 455 270 L 455 320" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 455 390 L 455 410 L 210 410" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="250" y="425" fill="#94a3b8" font-size="9">Tank Dump Return</text>

  <!-- Main Cylinder Ram (E203 Point) -->
  <rect x="580" y="140" width="160" height="260" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
  <text x="595" y="168" fill="#f8fafc" font-size="12" font-weight="bold">PRESS RAM CYLINDER</text>
  <!-- Guide Pillars Left & Right -->
  <rect x="590" y="190" width="16" height="190" rx="3" fill="#64748b" stroke="#94a3b8"/>
  <rect x="714" y="190" width="16" height="190" rx="3" fill="#64748b" stroke="#94a3b8"/>
  <!-- Ram Platen -->
  <rect x="615" y="240" width="90" height="80" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="630" y="285" fill="#7dd3fc" font-size="11" font-weight="bold">RAM HEAD</text>
  <text x="590" y="415" fill="#94a3b8" font-size="9">E203: Guide Pillar Lube / Leveling</text>

  <!-- Pressure Delivery from Relief to Cylinder -->
  <path d="M 510 230 L 580 230" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Diagnostic Action Box -->
  <rect x="250" y="106" width="380" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="260" y="124" fill="#fee2e2" font-size="10" font-weight="bold">E101 CHECKPOINT: Verify sight gauge level &amp; tighten pressure line fittings</text>
</svg>
