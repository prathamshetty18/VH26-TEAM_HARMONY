<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0b1120; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">
  <defs>
    <filter id="glowHeat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title &amp; Metadata Header -->
  <rect x="20" y="16" width="760" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="36" y="44" fill="#38bdf8" font-size="16" font-weight="bold">SYSTEM SCHEMATIC: SPINDLE MOTOR STATOR &amp; CHILLER COOLING JACKET</text>
  <text x="590" y="44" fill="#94a3b8" font-size="12">DOC ID: DIA-MX7-E108 | REV 2.0</text>

  <!-- Chiller Refrigeration Unit -->
  <rect x="50" y="240" width="150" height="150" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
  <text x="65" y="270" fill="#f8fafc" font-size="12" font-weight="bold">CHILLER UNIT</text>
  <text x="65" y="295" fill="#38bdf8" font-size="11">Glycol Reservoir</text>
  <text x="65" y="320" fill="#94a3b8" font-size="10">Target Temp: 20&#176;C</text>
  <text x="65" y="340" fill="#94a3b8" font-size="10">Pressure: 2.5 bar</text>

  <!-- Cooling Jacket Cross-Section (Outer Housing) -->
  <rect x="300" y="140" width="340" height="260" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
  <rect x="320" y="160" width="300" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="335" y="185" fill="#7dd3fc" font-size="11" font-weight="bold">HELICAL GLYCOL COOLING JACKET</text>

  <!-- Stator Winding &amp; Core (E108 Heat Fault Location) -->
  <g filter="url(#glowHeat)">
    <rect x="360" y="200" width="220" height="140" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
  </g>
  <text x="390" y="235" fill="#fee2e2" font-size="13" font-weight="bold">STATOR WINDINGS</text>
  <text x="385" y="260" fill="#f87171" font-size="11" font-weight="bold">RTD THERMISTOR RTD-01</text>
  <text x="400" y="285" fill="#ef4444" font-size="11" font-weight="bold">E108 TRIP &gt; 115&#176;C</text>
  <text x="415" y="315" fill="#fecaca" font-size="10">Class H Insulation</text>

  <!-- Spindle Rotating Shaft (Rotor) -->
  <rect x="250" y="255" width="450" height="30" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="635" y="250" fill="#f8fafc" font-size="10">Rotor Shaft</text>

  <!-- Bearings Front and Rear -->
  <rect x="330" y="235" width="25" height="70" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="585" y="235" width="25" height="70" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <text x="325" y="325" fill="#7dd3fc" font-size="9">Bearing Front</text>
  <text x="580" y="325" fill="#7dd3fc" font-size="9">Bearing Rear</text>

  <!-- Cooling Lines Supply and Return -->
  <path d="M 200 280 L 300 280" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 300 350 L 200 350" fill="none" stroke="#0284c7" stroke-width="4"/>
  <text x="215" y="270" fill="#38bdf8" font-size="10">SUPPLY 20&#176;C</text>
  <text x="215" y="370" fill="#0284c7" font-size="10">RETURN 25&#176;C</text>

  <!-- Diagnostic Callout -->
  <rect x="330" y="80" width="280" height="50" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="340" y="100" fill="#fef2f2" font-size="11" font-weight="bold">E108 OVERTEMP CHECKPOINT:</text>
  <text x="340" y="118" fill="#fecaca" font-size="10">Inspect chiller fluid level &amp; verify cooling fin airflow</text>
  <line x1="470" y1="130" x2="470" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
</svg>